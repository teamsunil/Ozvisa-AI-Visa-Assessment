<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northbridge Insurance — Car Insurance, Sorted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D;
    --ink-soft:#233559;
    --paper:#F6F4EF;
    --paper-raised:#FFFFFF;
    --accent:#C9971C;
    --accent-deep:#A87A12;
    --slate:#3A3F4B;
    --slate-light:#6B7280;
    --line:#DAD5C9;
    --line-soft:#E8E4D9;
    --success:#2E7D5B;
    --success-bg:#E7F1EB;
    --error:#B3261E;
    --error-bg:#FBEAE8;
    --radius:3px;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    color:var(--slate);
    background:var(--paper);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);margin:0;font-weight:600;}
  p{margin:0;}
  a{color:inherit;}
  button{font-family:var(--sans);cursor:pointer;}
  input,select,textarea{font-family:var(--sans);}
  ::selection{background:var(--accent);color:#fff;}
  :focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px;}

  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  .wrap-narrow{max-width:760px;margin:0 auto;padding:0 24px;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 26px;border-radius:var(--radius);border:1px solid transparent;
    font-size:15px;font-weight:600;transition:background .15s ease,border-color .15s ease,color .15s ease;
    white-space:nowrap;
  }
  .btn-primary{background:var(--accent);color:var(--ink);border-color:var(--accent);}
  .btn-primary:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;}
  .btn-primary:disabled{background:#E9DCB8;border-color:#E9DCB8;color:#9C9370;cursor:not-allowed;}
  .btn-ink{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn-ink:hover{background:var(--ink-soft);}
  .btn-outline{background:transparent;color:var(--ink);border-color:var(--ink);}
  .btn-outline:hover{background:var(--ink);color:#fff;}
  .btn-ghost{background:transparent;color:var(--slate);border-color:transparent;}
  .btn-ghost:hover{color:var(--ink);text-decoration:underline;}
  .btn-danger{background:transparent;color:var(--error);border-color:var(--error);}
  .btn-danger:hover{background:var(--error);color:#fff;}
  .btn-sm{padding:8px 14px;font-size:13px;}
  .btn-block{width:100%;}

  /* ---------- Header / Nav ---------- */
  .site-header{border-bottom:1px solid var(--line);background:var(--paper-raised);position:sticky;top:0;z-index:50;}
  .site-header .inner{display:flex;align-items:center;justify-content:space-between;padding:18px 0;}
  .logo{display:flex;align-items:baseline;gap:8px;cursor:pointer;}
  .logo .mark{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--ink);letter-spacing:-0.01em;}
  .logo .mark span{color:var(--accent-deep);}
  .logo .sub{font-size:11px;color:var(--slate-light);letter-spacing:.02em;}
  .nav-actions{display:flex;align-items:center;gap:10px;}
  .nav-link{font-size:14px;font-weight:600;color:var(--ink);padding:10px 6px;}
  .nav-link:hover{color:var(--accent-deep);}
  .site-footer{border-top:1px solid var(--line);margin-top:80px;padding:36px 0;}
  .site-footer .inner{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center;font-size:13px;color:var(--slate-light);}
  .site-footer a{color:var(--slate-light);text-decoration:underline;text-underline-offset:2px;}
  .site-footer a:hover{color:var(--ink);}

  /* ---------- Hero ---------- */
  .hero{padding:64px 0 56px;}
  .hero .grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center;}
  .eyebrow-plain{font-size:14px;color:var(--slate-light);margin-bottom:14px;}
  .hero h1{font-size:clamp(34px,4.4vw,54px);line-height:1.05;letter-spacing:-0.01em;max-width:11ch;}
  .hero .lede{margin-top:20px;font-size:17px;color:var(--slate);max-width:46ch;}
  .hero .cta-row{margin-top:32px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .hero .microcopy{margin-top:14px;font-size:13px;color:var(--slate-light);}

  .cover-note{
    background:var(--ink);color:#EDEAE0;border-radius:6px;padding:28px;
    font-family:var(--mono);position:relative;box-shadow:0 24px 48px -20px rgba(20,33,61,.45);
  }
  .cover-note::before{content:"";position:absolute;top:0;left:24px;right:24px;height:1px;background:rgba(237,234,224,.18);top:64px;}
  .cover-note .cn-top{display:flex;justify-content:space-between;font-size:11px;color:#B9C2D6;text-transform:uppercase;letter-spacing:.08em;padding-bottom:16px;}
  .cover-note .cn-body{padding-top:22px;}
  .cover-note .cn-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed rgba(237,234,224,.16);font-size:13px;}
  .cover-note .cn-row span:first-child{color:#8E9BB8;}
  .cover-note .cn-price{font-family:var(--serif);font-size:32px;color:#fff;margin-top:18px;font-weight:600;}
  .cover-note .cn-price small{font-family:var(--sans);font-size:13px;color:#B9C2D6;font-weight:400;}
  .cover-note .cn-stamp{position:absolute;top:-11px;right:-10px;border:1.5px solid var(--accent);background:var(--ink);color:var(--accent);font-family:var(--sans);font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;letter-spacing:.06em;transform:rotate(4deg);}

  .strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0;}
  .strip .row{display:flex;gap:40px;flex-wrap:wrap;justify-content:space-between;}
  .strip .item{flex:1;min-width:200px;}
  .strip .item .num{font-family:var(--serif);font-size:26px;color:var(--ink);font-weight:600;}
  .strip .item .lab{font-size:13px;color:var(--slate-light);margin-top:4px;}

  .section{padding:64px 0;}
  .section h2{font-size:clamp(24px,3vw,32px);max-width:20ch;}
  .section .lede{margin-top:14px;color:var(--slate-light);max-width:56ch;font-size:15.5px;}
  .cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:36px;border-top:1px solid var(--line);}
  .cards3 .card{padding:26px 22px 26px 0;border-bottom:1px solid var(--line);}
  .cards3 .card:not(:last-child){border-right:1px solid var(--line);padding-right:26px;}
  .cards3 .card .idx{font-family:var(--mono);font-size:12px;color:var(--accent-deep);}
  .cards3 .card h3{font-size:18px;margin-top:10px;}
  .cards3 .card p{font-size:14px;color:var(--slate-light);margin-top:8px;}

  /* ---------- Form shell (quote journey) ---------- */
  .form-shell{padding:32px 0 80px;}
  .progress-wrap{margin-bottom:36px;}
  .progress-steps{display:flex;gap:0;list-style:none;padding:0;margin:0 0 10px;}
  .progress-steps li{flex:1;text-align:center;font-size:11px;color:var(--slate-light);position:relative;padding-top:26px;}
  .progress-steps li::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:20px;height:20px;border-radius:50%;background:var(--paper-raised);border:1.5px solid var(--line);
    font-family:var(--mono);font-size:11px;color:var(--slate-light);display:flex;align-items:center;justify-content:center;}
  .progress-steps li.done::before{content:"✓";background:var(--ink);border-color:var(--ink);color:#fff;}
  .progress-steps li.active::before{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700;}
  .progress-steps li.active{color:var(--ink);font-weight:600;}
  .progress-steps li::after{content:"";position:absolute;top:10px;left:-50%;width:100%;height:1px;background:var(--line);z-index:-1;}
  .progress-steps li:first-child::after{display:none;}
  .progress-bar-mobile{display:none;}
  .progress-bar-track{height:4px;background:var(--line-soft);border-radius:2px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:var(--accent);transition:width .3s ease;}

  .form-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:6px;padding:36px;}
  .form-card h2{font-size:22px;}
  .form-card .step-hint{font-size:13px;color:var(--slate-light);margin-top:6px;margin-bottom:28px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
  .field-row.one{grid-template-columns:1fr;}
  .field-row.three{grid-template-columns:1fr 1fr 1fr;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:600;color:var(--ink);}
  .field .hint{font-size:12px;color:var(--slate-light);font-weight:400;}
  .field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=date],.field input[type=number],.field select,.field textarea{
    padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:14.5px;color:var(--ink);background:#fff;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);}
  .field.error input,.field.error select{border-color:var(--error);background:var(--error-bg);}
  .field .err-msg{font-size:12.5px;color:var(--error);display:none;}
  .field.error .err-msg{display:block;}
  .radio-group{display:flex;flex-direction:column;gap:10px;}
  .radio-card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;}
  .radio-card:hover{border-color:var(--ink-soft);}
  .radio-card.selected{border-color:var(--ink);background:#FBFAF7;box-shadow:inset 0 0 0 1px var(--ink);}
  .radio-card input{margin-top:3px;}
  .radio-card .rc-title{font-weight:600;color:var(--ink);font-size:14.5px;}
  .radio-card .rc-sub{font-size:13px;color:var(--slate-light);margin-top:2px;}
  .check-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-soft);}
  .check-row:last-child{border-bottom:none;}
  .check-row label{font-size:14px;color:var(--ink);font-weight:500;}
  .check-row .sub{font-size:12.5px;color:var(--slate-light);}
  .toggle-yn{display:flex;gap:10px;}
  .toggle-yn button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:var(--radius);font-weight:600;font-size:14px;color:var(--slate);}
  .toggle-yn button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .conditional-block{margin-top:6px;padding:16px;background:#FBFAF7;border:1px dashed var(--line);border-radius:var(--radius);}
  .lookup-row{display:flex;gap:10px;align-items:flex-end;}
  .lookup-row .field{flex:1;}
  .vehicle-result{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:#FBFAF7;display:none;}
  .vehicle-result.show{display:block;}
  .vehicle-result .vr-row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;}
  .vehicle-result .vr-row span:first-child{color:var(--slate-light);}
  .form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:22px;border-top:1px solid var(--line-soft);}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
  .spinner.dark{border:2px solid rgba(20,33,61,.25);border-top-color:var(--ink);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-panel{text-align:center;padding:70px 20px;}
  .loading-panel .pulse-list{margin-top:26px;display:inline-block;text-align:left;}
  .loading-panel .pulse-item{font-size:14px;color:var(--slate-light);padding:6px 0;display:flex;gap:10px;align-items:center;}
  .loading-panel .pulse-item.done{color:var(--success);}
  .loading-panel .pulse-item .dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .loading-panel .pulse-item.done .dot{background:var(--success);}

  /* ---------- Quote results ---------- */
  .quotes-header{padding:36px 0 12px;}
  .quote-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px;align-items:stretch;}
  .quote-card{border:1px solid var(--line);border-radius:6px;background:#fff;display:flex;flex-direction:column;position:relative;}
  .quote-card.best::before{content:"Best value";position:absolute;top:-11px;left:20px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .quote-card .qc-head{padding:22px 22px 16px;border-bottom:1px solid var(--line-soft);}
  .quote-card .insurer{font-family:var(--serif);font-size:19px;color:var(--ink);font-weight:600;}
  .quote-card .cover-badge{display:inline-block;margin-top:8px;font-size:12px;background:#EEF1F7;color:var(--ink-soft);padding:3px 9px;border-radius:20px;font-weight:600;}
  .quote-card .qc-price{padding:18px 22px;border-bottom:1px solid var(--line-soft);}
  .quote-card .price-annual{font-family:var(--serif);font-size:30px;color:var(--ink);font-weight:600;}
  .quote-card .price-monthly{font-size:13px;color:var(--slate-light);margin-top:4px;}
  .quote-card .qc-details{padding:16px 22px;flex:1;}
  .quote-card .qc-details .dr{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line-soft);}
  .quote-card .qc-details .dr span:first-child{color:var(--slate-light);}
  .quote-card .benefits{list-style:none;margin:10px 0 0;padding:0;}
  .quote-card .benefits li{font-size:13px;padding:4px 0 4px 20px;position:relative;color:var(--slate);}
  .quote-card .benefits li::before{content:"✓";position:absolute;left:0;color:var(--success);font-weight:700;}
  .quote-card .qc-actions{padding:18px 22px 22px;display:flex;flex-direction:column;gap:10px;}

  /* ---------- Purchase / payment ---------- */
  .summary-block{border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:22px;overflow:hidden;}
  .summary-block .sb-head{padding:16px 22px;background:#FBFAF7;border-bottom:1px solid var(--line);font-weight:600;color:var(--ink);font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  .summary-block .sb-head a{font-size:12.5px;color:var(--ink-soft);text-decoration:underline;font-weight:500;}
  .summary-block .sb-body{padding:6px 22px;}
  .summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px;}
  .summary-row:last-child{border-bottom:none;}
  .summary-row span:first-child{color:var(--slate-light);}
  .summary-row span:last-child{color:var(--ink);font-weight:500;text-align:right;}
  .price-total{display:flex;justify-content:space-between;align-items:baseline;padding:20px 22px;background:var(--ink);color:#fff;border-radius:6px;margin-bottom:24px;}
  .price-total .lab{font-size:14px;color:#C9D2E5;}
  .price-total .val{font-family:var(--serif);font-size:26px;font-weight:600;}
  .price-total .val small{font-family:var(--sans);font-size:13px;color:#C9D2E5;font-weight:400;}
  .card-mock{display:flex;gap:10px;margin-bottom:20px;}
  .card-mock-face{flex:1;height:150px;border-radius:10px;background:linear-gradient(135deg,var(--ink),var(--ink-soft));color:#fff;padding:20px;position:relative;font-family:var(--mono);}
  .card-mock-face .cnum{font-size:17px;letter-spacing:.1em;margin-top:34px;}
  .card-mock-face .crow{display:flex;justify-content:space-between;margin-top:18px;font-size:11px;color:#B9C2D6;text-transform:uppercase;}
  .card-mock-face .cbrand{position:absolute;top:20px;right:20px;font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.05em;}
  .pay-note{font-size:12.5px;color:var(--slate-light);background:#FBFAF7;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:20px;}

  .success-panel{text-align:center;padding:60px 20px;}
  .success-check{width:64px;height:64px;border-radius:50%;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:30px;}
  .policy-num-box{display:inline-block;margin:18px auto;padding:14px 24px;border:1px dashed var(--line);border-radius:var(--radius);font-family:var(--mono);font-size:18px;color:var(--ink);background:#FBFAF7;}
  .email-status{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--slate-light);margin-top:8px;}
  .email-status .dot{width:7px;height:7px;border-radius:50%;background:var(--success);}

  /* ---------- Alerts / toasts ---------- */
  .banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius);font-size:13.5px;margin-bottom:18px;}
  .banner.error{background:var(--error-bg);color:var(--error);border:1px solid #EFC9C5;}
  .banner.success{background:var(--success-bg);color:var(--success);border:1px solid #C6E3D2;}
  .banner.info{background:#EEF1F7;color:var(--ink-soft);border:1px solid #D6DCEA;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:6px;font-size:14px;box-shadow:0 12px 30px rgba(20,33,61,.3);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  /* ---------- Auth ---------- */
  .auth-shell{padding:70px 0 100px;}
  .auth-card{max-width:420px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:36px;}
  .auth-card h2{font-size:22px;text-align:center;}
  .auth-card .sub{text-align:center;font-size:13.5px;color:var(--slate-light);margin-top:8px;margin-bottom:26px;}
  .demo-hint{background:#EEF1F7;border:1px solid #D6DCEA;border-radius:var(--radius);padding:10px 14px;font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}

  /* ---------- Portal / Admin shell ---------- */
  .app-shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 65px);}
  .app-sidebar{border-right:1px solid var(--line);background:#fff;padding:26px 0;}
  .app-sidebar .sb-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate-light);padding:0 22px;margin-bottom:10px;}
  .app-sidebar nav{display:flex;flex-direction:column;}
  .app-sidebar nav a{padding:11px 22px;font-size:14px;color:var(--slate);font-weight:500;border-left:3px solid transparent;cursor:pointer;}
  .app-sidebar nav a:hover{background:#FBFAF7;color:var(--ink);}
  .app-sidebar nav a.active{border-left-color:var(--accent);background:#FBFAF7;color:var(--ink);font-weight:600;}
  .app-main{padding:34px 36px;}
  .app-main h1.page-title{font-size:24px;margin-bottom:4px;}
  .page-sub{font-size:13.5px;color:var(--slate-light);margin-bottom:26px;}

  .stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;margin-bottom:30px;}
  .stat-cell{padding:20px 20px;border-right:1px solid var(--line);}
  .stat-cell:last-child{border-right:none;}
  .stat-cell .s-num{font-family:var(--serif);font-size:26px;color:var(--ink);font-weight:600;}
  .stat-cell .s-lab{font-size:12.5px;color:var(--slate-light);margin-top:4px;}

  .panel{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:24px;}
  .panel .p-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .panel .p-head h3{font-size:15.5px;}
  .panel .p-body{padding:20px 22px;}

  .policy-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;margin-bottom:26px;}
  .policy-hero .ph-left{padding:26px;border-right:1px solid var(--line);}
  .policy-hero .ph-right{padding:26px;background:#FBFAF7;}
  .ph-status{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--success-bg);color:var(--success);margin-bottom:12px;}
  .policy-hero .pn{font-family:var(--mono);font-size:15px;color:var(--ink-soft);margin-bottom:4px;}
  .policy-hero h2{font-size:21px;}
  .kv-list{margin-top:16px;}
  .kv-list .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line-soft);}
  .kv-list .kv span:first-child{color:var(--slate-light);}
  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}

function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function addDaysISO(days){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function fmtDateNice(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear();
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}

  document.getElementById("modal-overlay").addEventListener("click", function(e){
    if(e.target.id === "modal-overlay") closeModal();
  });
}
function closeModal(){
  document.getElementById("modal-root").innerHTML = "";
}
function downloadTextFile(filename, content){
  const blob = new Blob([content], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function field(label, inner, id, hint){

    <label>${label}${hint?` <span class="hint">${hint}</span>`:""}</label>
    ${inner}
    <span class="err-msg"></span>
  </div>`;
}

function radioCard(key, value, sub, current){
  const selected = current === value;
  return `<label class="radio-card ${selected?"selected":""}" data-action="select-radio-card" data-key="${key}" data-value="${value}">
    <input type="radio" name="${key}" ${selected?"checked":""} style="pointer-events:none;">
    <div><div class="rc-title">${value}</div><div class="rc-sub">${sub}</div></div>
  </label>`;
}
function checkRow(key, label, sub, checked){
  return `<div class="check-row">
    <input type="checkbox" id="addon-${key}" data-action="toggle-addon" data-key="${key}" ${checked?"checked":""}>
    <div><label for="addon-${key}">${label}</label><div class="sub">${sub}</div></div>
  </div>`;
}

/* ---- Validation per step ---- */
function clearFieldErrors(){
  document.querySelectorAll("#form-fields .field").forEach(f=>{
    f.classList.remove("error");
    const em = f.querySelector(".err-msg"); if(em) em.textContent="";
  });
}
function setFieldError(id, msg){
  const f = document.getElementById("field-"+id);
  if(!f) return;
  f.classList.add("error");
  f.querySelector(".err-msg").textContent = msg;
}
function validateStep(){
  clearFieldErrors();
  const fd = state.formData;
  let ok = true;

  if(state.formStep === 1){
    if(!fd.reg || fd.reg.trim().length < 4){ setFieldError("reg","Enter a valid registration number."); ok=false; }
    if(!fd.make){ showToast("Look up your vehicle before continuing."); ok=false; }
  }
  if(state.formStep === 2){
    if(!fd.firstName){ setFieldError("firstName","Enter your first name."); ok=false; }
    if(!fd.lastName){ setFieldError("lastName","Enter your last name."); ok=false; }
    if(!fd.dob){ setFieldError("dob","Enter your date of birth."); ok=false; }
    else{
      const age = Math.floor((new Date()-new Date(fd.dob))/(365.25*24*3600*1000));
      if(age < 17){ setFieldError("dob","Driver must be at least 17 years old."); ok=false; }
    }
    if(!fd.marital){ setFieldError("marital","Select a marital status."); ok=false; }
    if(!fd.email || !/^\S+@\S+\.\S+$/.test(fd.email)){ setFieldError("email","Enter a valid email address."); ok=false; }
    if(!fd.phone || fd.phone.replace(/\D/g,"").length < 9){ setFieldError("phone","Enter a valid phone number."); ok=false; }
  }
  if(state.formStep === 3){
    if(!fd.addr1){ setFieldError("addr1","Enter your address."); ok=false; }
    if(!fd.city){ setFieldError("city","Enter your town or city."); ok=false; }
    if(!fd.postcode || fd.postcode.trim().length < 5){ setFieldError("postcode","Enter a valid postcode."); ok=false; }
  }
  if(state.formStep === 4){
    if(!fd.licenceNumber || fd.licenceNumber.trim().length < 5){ setFieldError("licenceNumber","Enter your licence number."); ok=false; }
    if(fd.licenceType==="Full UK" && !fd.datePassed){ setFieldError("datePassed","Enter the date you passed your test."); ok=false; }
  }
  if(state.formStep === 5){
    if(fd.hasClaims === null){ showToast("Let us know if you've made any claims."); ok=false; }
    if(fd.hasClaims === true && !fd.claimDate){ setFieldError("claimDate","Enter the claim date."); ok=false; }
    if(fd.hasConvictions === null){ showToast("Let us know about any convictions."); ok=false; }
    if(fd.hasConvictions === true && !fd.convictionDate){ setFieldError("convictionDate","Enter the conviction date."); ok=false; }
  }
  if(state.formStep === 6){
    if((fd.employment==="Employed"||fd.employment==="Self-employed") && !fd.jobTitle){ setFieldError("jobTitle","Select a job title."); ok=false; }
  }
  if(state.formStep === 9){
    if(!fd.startDate){ fd.startDate = todayISO(); }
  }
  return ok;
}

/* ------------------------------ Quote calculation --------------------------- */

function calculateBaseAnnualPremium(){
  const fd = state.formData;
  let base = 460;
  base += (Number(fd.mileage)/1000) * 2.4;
  if(fd.usage === "Business") base += 160;
  else if(fd.usage === "Social + Commuting") base += 55;
  base += Number(fd.namedDrivers) * 38;
  const excessDiscount = {"0":0,"100":15,"250":42,"500":85}[fd.excess] || 0;
  base -= excessDiscount;
  if(fd.hasClaims === true) base += 190 * Number(fd.claimsCount || 1);
  if(fd.hasConvictions === true) base += 140;
  if(fd.coverLevel === "Comprehensive") base += 95;
  else if(fd.coverLevel === "Third Party, Fire & Theft") base += 35;
  if(fd.dob){
    const age = Math.floor((new Date()-new Date(fd.dob))/(365.25*24*3600*1000));
    if(age < 21) base += 340;
    else if(age < 25) base += 210;
    else if(age < 30) base += 90;
    else if(age > 70) base += 60;
  }
  if(fd.licenceType === "Provisional") base += 260;
  if(fd.addons.breakdown) base += 42;
  if(fd.addons.legal) base += 24;
  if(fd.addons.courtesy) base += 30;
  if(fd.addons.ncdProtect) base += 20;
  return Math.max(base, 280);
}

function generateQuotes(){
  const base = calculateBaseAnnualPremium();
  const fd = state.formData;
  const benefitsFor = (cover, insurerIdx) => {
    const list = [];
    if(cover === "Comprehensive"){ list.push("Cover for your own car, any fault","Windscreen cover included","Courtesy car while repaired"); }
    else if(cover === "Third Party, Fire & Theft"){ list.push("Fire and theft cover","Third party liability cover"); }
    else { list.push("Legal minimum cover","Third party liability cover"); }
    if(fd.addons.breakdown) list.push("24/7 UK breakdown cover");
    if(fd.addons.legal) list.push("Legal expenses cover");
    if(fd.addons.ncdProtect) list.push("No claims discount protected");
    if(insurerIdx === 2) list.push("Multi-car discount available");
    return list.slice(0,4);
  };
  const quotes = INSURER_PROFILES.map((ins, idx)=>{
    const annual = Math.round(base * ins.multiplier * 100) / 100;
    const monthly = Math.round((annual * 1.11 / 12) * 100) / 100;
    return {
      insurer: ins.name,
      rating: ins.rating,
      annual, monthly,
      excess: Number(fd.excess) + ins.excessBase,
      cover: fd.coverLevel,
      benefits: benefitsFor(fd.coverLevel, idx),
    };
  }).sort((a,b)=>a.annual-b.annual);
  return quotes;
}

/* ------------------------------ Loading -> Quotes --------------------------- */

function renderQuoteLoading(){
  app().innerHTML = `
  ${headerHTML()}
  <section class="wrap-narrow loading-panel">
    <h2>Comparing quotes for you…</h2>
    <p class="lede" style="margin:10px auto 0;">We're checking prices with our panel of insurers. This usually takes a few seconds.</p>
    <div class="pulse-list" id="pulse-list">
      <div class="pulse-item" data-i="0"><span class="dot"></span> Checking Meridian Direct</div>
      <div class="pulse-item" data-i="1"><span class="dot"></span> Checking Castlegate Insurance</div>
      <div class="pulse-item" data-i="2"><span class="dot"></span> Checking Anchor &amp; Oak Insurance</div>
    </div>
  </section>
  `;
  const items = document.querySelectorAll("#pulse-list .pulse-item");
  let i = 0;
  const tick = () => {
    if(i < items.length){
      items[i].classList.add("done");
      i++;
      setTimeout(tick, 550);
    } else {
      setTimeout(()=>{
        state.quotes = generateQuotes();
        go("quote-results");
      }, 400);
    }
  };
  setTimeout(tick, 500);
}

    let v = this.value.replace(/\D/g,"").slice(0,16);
    this.value = v.replace(/(\d{4})(?=\d)/g,"$1 ");

function processPayment(){
  clearFieldErrors();
  const name = document.getElementById("pay-name").value.trim();
  const number = document.getElementById("pay-number").value.replace(/\s/g,"");
  const exp = document.getElementById("pay-exp").value.trim();
  const cvv = document.getElementById("pay-cvv").value.trim();
  let ok = true;
  if(!name){ setFieldError("pay-name","Enter the name on the card."); ok=false; }
  if(number.length < 12){ setFieldError("pay-number","Enter a valid card number."); ok=false; }
  if(!/^\d{2}\/\d{2}$/.test(exp)){ setFieldError("pay-exp","Enter a valid expiry date."); ok=false; }
  if(cvv.length < 3){ setFieldError("pay-cvv","Enter a valid CVV."); ok=false; }
  if(!ok) return;

  const btn = document.getElementById("pay-btn");
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Processing payment…`;
  setTimeout(()=>{
    const q = state.quotes[state.selectedQuoteIndex];
    const fd = state.formData;
    const policyNumber = "NB-2026-" + String(Math.floor(10000+Math.random()*89999));
    state.policy = {
      number: policyNumber,
      customerName: `${fd.firstName} ${fd.lastName}`,
      email: fd.email,
      insurer: q.insurer,
      cover: q.cover,
      excess: q.excess,
      annual: q.annual,
      monthly: q.monthly,
      vehicle: `${fd.make} ${fd.model}`,
      reg: fd.reg,
      startDate: fd.startDate,
      renewalDate: addDaysISO(365),
      paymentStatus: "Paid",
    };
    go("policy-issued");
  }, 1600);
}

function pillFor(status){
  const s = status.toLowerCase();
  if(["active","successful","resolved","converted","settled"].includes(s)) return `<span class="pill green">${status}</span>`;
  if(["pending","due soon","in progress","quoted","open"].includes(s)) return `<span class="pill amber">${status}</span>`;
  if(["cancelled","failed","rejected","lapsed","expired"].includes(s)) return `<span class="pill red">${status}</span>`;
  return `<span class="pill grey">${status}</span>`;
}

    return `<h1 class="page-title">Insurer partners</h1><div class="page-sub">Panel insurers used to generate quotes.</div>
      <div class="panel"><div class="p-body">
      ${buildTable("tbl-insurers",["Insurer","Active policies","Rating","Partner since","Contact"], rows)}
      </div></div>`;
  }

  if(sec === "claims"){
    const rows = CLAIMS.map(c=>`<tr>
      <td>${c.id}</td><td>${c.customer}</td><td>${c.policy}</td><td>${c.type}</td><td>${c.date}</td><td>${pillFor(c.status)}</td>

      <div class="panel"><div class="p-body">
      ${tableToolbar("search-claims","Search claims by customer…")}
      ${buildTable("tbl-claims",["Claim ID","Customer","Policy","Type","Date","Status"], rows)}
      </div></div>`;
  }

  if(sec === "renewals"){
    const rows = RENEWALS.map(r=>`<tr>
      <td>${r.policy}</td><td>${r.customer}</td><td>${r.renewalDate}</td><td>${r.newPremium}</td><td>${pillFor(r.status)}</td>
    </tr>`).join("");
    return `<h1 class="page-title">Renewals</h1><div class="page-sub">${RENEWALS.length} upcoming renewals (demo data).</div>
      <div class="panel"><div class="p-body">
      ${buildTable("tbl-renewals",["Policy number","Customer","Renewal date","New premium","Status"], rows)}
      </div></div>`;
  }

  if(sec === "cancellations"){
    const rows = CANCELLATIONS.map(c=>`<tr>
      <td>${c.policy}</td><td>${c.customer}</td><td>${c.date}</td><td>${c.reason}</td><td>${c.refund}</td>
    </tr>`).join("");
    return `<h1 class="page-title">Cancellations</h1><div class="page-sub">${CANCELLATIONS.length} cancelled policies (demo data).</div>
      <div class="panel"><div class="p-body">
      ${buildTable("tbl-cancellations",["Policy number","Customer","Date","Reason","Refund"], rows)}
      </div></div>`;
  }

  if(sec === "complaints"){
    const rows = COMPLAINTS.map(c=>`<tr>
      <td>${c.id}</td><td>${c.customer}</td><td>${c.subject}</td><td>${c.date}</td><td>${pillFor(c.status)}</td>
    </tr>`).join("");
    return `<h1 class="page-title">Complaints</h1><div class="page-sub">${COMPLAINTS.length} complaints logged (demo data).</div>
      <div class="panel"><div class="p-body">
      ${buildTable("tbl-complaints",["Complaint ID","Customer","Subject","Date","Status"], rows)}
      </div></div>`;
  }

  if(sec === "reports"){
    return `<h1 class="page-title">Reports</h1><div class="page-sub">Summary reporting across the platform (demo data).</div>
      <div class="panel">
        <div class="p-head"><h3>Conversion: quotes → policies</h3></div>
        <div class="p-body">
          <div class="bar-chart">
            <div class="bar-col"><div class="bar-val">628</div><div class="bar" style="height:100%"></div><div class="bar-lab">Quotes</div></div>
            <div class="bar-col"><div class="bar-val">412</div><div class="bar" style="height:66%"></div><div class="bar-lab">Policies</div></div>
            <div class="bar-col"><div class="bar-val">66%</div><div class="bar" style="height:66%;background:var(--ink);"></div><div class="bar-lab">Conversion rate</div></div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="p-head"><h3>Monthly premium written</h3></div>
        <div class="p-body">
          <div class="bar-chart">
            <div class="bar-col"><div class="bar-val">£41k</div><div class="bar" style="height:55%"></div><div class="bar-lab">Jun</div></div>
            <div class="bar-col"><div class="bar-val">£48k</div><div class="bar" style="height:64%"></div><div class="bar-lab">Jul</div></div>
            <div class="bar-col"><div class="bar-val">£52k</div><div class="bar" style="height:70%"></div><div class="bar-lab">Aug</div></div>
            <div class="bar-col"><div class="bar-val">£61k</div><div class="bar" style="height:82%"></div><div class="bar-lab">Sep</div></div>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="p-head"><h3>Export</h3></div>
        <div class="p-body">
          <p style="font-size:14px;color:var(--slate-light);margin-bottom:14px;">Download a demo CSV export of platform records.</p>
          <button class="btn btn-outline btn-sm" data-action="admin-export">Export summary (.txt)</button>
        </div>
      </div>
    `;
  }
  return "";
}

function filterTable(inputId){
  const input = document.getElementById(inputId);
  if(!input) return;
  const val = input.value.toLowerCase();
  const tableId = "tbl-" + inputId.replace("search-","");
  const table = document.getElementById(tableId);
  if(!table) return;
  table.querySelectorAll("tbody tr").forEach(tr=>{
    tr.style.display = tr.textContent.toLowerCase().includes(val) ? "" : "none";
  });
}

/* ------------------------------ Router / main render --------------------------- */

function render(){
  switch(state.view){
    case "home": return renderHome();
    case "help": return renderHelp();
    case "quote-form": return renderQuoteForm();
    case "quote-loading": return renderQuoteLoading();
    case "quote-results": return renderQuoteResults();
    case "purchase": return renderPurchase();
    case "payment": return renderPayment();
    case "policy-issued": return renderPolicyIssued();
    case "portal-login": return renderPortalLogin();
    case "portal": return renderPortal();
    case "admin-login": return renderAdminLogin();
    case "admin": return renderAdmin();
    default: return renderHome();
  }
}

/* ------------------------------ Event delegation -------------------------------- */

document.addEventListener("click", function(e){
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;

  switch(action){
    case "go-home": go("home"); break;
    case "go-help": go("help"); break;
    case "go-quote-start":
      state.formStep = 1;
      go("quote-form");
      break;
    case "go-portal-login": go("portal-login"); break;
    case "go-admin-login": go("admin-login"); break;

    case "form-back":
      if(state.formStep > 1){ state.formStep--; render(); }
      break;
    case "form-next":
      if(validateStep()){
        if(state.formStep < TOTAL_STEPS){
          state.formStep++;
          render();
        } else {
          go("quote-loading");
        }
      }
      break;

    case "lookup-vehicle":{
      const regInput = document.querySelector('[data-field="reg"]');
      const reg = (regInput.value||"").toUpperCase().replace(/\s/g,"");
      state.formData.reg = regInput.value;
      if(!reg || reg.length < 4){ setFieldError("reg","Enter a valid registration number."); break; }
      const btn = t;
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner dark"></span> Looking up…`;
      setTimeout(()=>{
        const result = VEHICLE_DB[reg] || VEHICLE_FALLBACK;
        state.formData.make = result.make;
        state.formData.model = result.model;
        state.formData.year = result.year;
        state.formData.value = result.value;
        btn.disabled = false;
        btn.textContent = originalText;
        render();
        showToast("Vehicle found: " + result.make + " " + result.model);
      }, 800);
      break;
    }

    case "select-radio-card":{
      const key = t.dataset.key, val = t.dataset.value;
      state.formData[key] = val;
      render();
      break;
    }
    case "set-yn":{
      const key = t.dataset.key;
      state.formData[key] = t.dataset.val === "true";
      render();
      break;
    }
    case "toggle-addon":{
      const key = t.dataset.key;
      state.formData.addons[key] = !state.formData.addons[key];
      break;
    }

    case "view-quote-details":
      openModal(quoteDetailsModalHTML(Number(t.dataset.i)));
      break;
    case "close-modal": closeModal(); break;
    case "select-quote":
      closeModal();
      state.selectedQuoteIndex = Number(t.dataset.i);
      go("purchase");
      break;
    case "go-back-to-quotes": go("quote-results"); break;
    case "edit-details":
      state.formStep = 2;
      go("quote-form");
      break;
    case "confirm-details": go("payment"); break;
    case "go-back-purchase": go("purchase"); break;
    case "submit-payment": processPayment(); break;

    case "download-policy":
      downloadTextFile("Policy_Document_"+state.policy.number+".txt", policyDocumentText(state.policy));
      showToast("Policy document downloaded");
      break;
    case "go-portal-from-policy":
      state.portalLoggedIn = true;
      state.portalCancelled = false;
      go("portal");
      break;

    case "portal-login":
      state.portalLoggedIn = true;
      go("portal");
      break;
    case "portal-logout":
      state.portalLoggedIn = false;
      go("home");
      break;
    case "portal-view-policy":{
      const p = state.policy || {number:"NB-2026-00421",vehicle:"Ford Fiesta 1.0 EcoBoost",cover:"Comprehensive",insurer:"Meridian Direct",excess:250,annual:700.80};
      openModal(`
        <h3>Policy ${p.number}</h3>
        <div class="summary-row"><span>Vehicle</span><span>${p.vehicle}</span></div>
        <div class="summary-row"><span>Cover level</span><span>${p.cover}</span></div>
        <div class="summary-row"><span>Insurer</span><span>${p.insurer}</span></div>
        <div class="summary-row"><span>Excess</span><span>£${p.excess}</span></div>
        <div class="summary-row"><span>Annual premium</span><span>£${p.annual.toFixed ? p.annual.toFixed(2) : p.annual}</span></div>
        <div class="modal-close-row"><button class="btn btn-primary" data-action="close-modal">Close</button></div>
      `);
      break;
    }
    case "portal-download":
      downloadTextFile("Policy_Document_"+(state.policy?state.policy.number:"NB-2026-00421")+".txt",
        policyDocumentText(state.policy || {number:"NB-2026-00421",customerName:"Sarah Mitchell",vehicle:"Ford Fiesta 1.0 EcoBoost",reg:"AB12 CDE",cover:"Comprehensive",insurer:"Meridian Direct",excess:250,annual:700.80,monthly:64.90,startDate:"2026-03-15",renewalDate:"2027-03-15",paymentStatus:"Paid"}));
      showToast("Document downloaded");
      break;
    case "portal-pay":
      openModal(`
        <h3>Make a payment</h3>
        <p style="font-size:14px;color:var(--slate-light);margin-bottom:16px;">This is a demo payment — no card will be charged.</p>
        <div class="field" style="margin-bottom:14px;"><label>Card number</label><input type="text" placeholder="4242 4242 4242 4242"></div>
        <div class="modal-close-row">
          <button class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button class="btn btn-primary" data-action="portal-pay-confirm">Pay now</button>
        </div>
      `);
      break;
    case "portal-pay-confirm":
      closeModal();
      showToast("Payment received — thank you");
      break;
    case "portal-change-details":
      openModal(`
        <h3>Change your details</h3>
        <div class="field" style="margin-bottom:14px;"><label>Email address</label><input type="email" value="${state.formData.email || 'sarah.mitchell@email.com'}"></div>
        <div class="field" style="margin-bottom:14px;"><label>Phone number</label><input type="tel" value="${state.formData.phone || '07700 900123'}"></div>
        <div class="modal-close-row">
          <button class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button class="btn btn-primary" data-action="portal-details-saved">Save changes</button>
        </div>
      `);
      break;
    case "portal-details-saved":
      closeModal();
      showToast("Details updated");
      break;
    case "portal-renew":
      openModal(`
        <h3>Renew your policy</h3>
        <p style="font-size:14px;color:var(--slate-light);margin-bottom:16px;">Your renewal quote is ${fmtGBP((state.policy?state.policy.annual:700.80)*1.04)} for the next 12 months.</p>
        <div class="modal-close-row">
          <button class="btn btn-ghost" data-action="close-modal">Not yet</button>
          <button class="btn btn-primary" data-action="portal-renew-confirm">Confirm renewal</button>
        </div>
      `);
      break;
    case "portal-renew-confirm":
      closeModal();
      showToast("Policy renewed for another 12 months");
      break;
    case "portal-cancel":
      openModal(`
        <h3>Cancel your policy</h3>
        <p style="font-size:14px;color:var(--slate-light);margin-bottom:16px;">Are you sure you want to cancel? This can't be undone in this demo.</p>
        <div class="modal-close-row">
          <button class="btn btn-ghost" data-action="close-modal">Keep my policy</button>
          <button class="btn btn-danger" data-action="portal-cancel-confirm">Yes, cancel policy</button>
        </div>
      `);
      break;
    case "portal-cancel-confirm":
      closeModal();
      state.portalCancelled = true;
      showToast("Policy cancelled");
      render();
      break;
    case "portal-contact":
      openModal(`
        <h3>Contact support</h3>
        <div class="field" style="margin-bottom:14px;"><label>Message</label><textarea rows="4" placeholder="How can we help?"></textarea></div>
        <div class="modal-close-row">
          <button class="btn btn-ghost" data-action="close-modal">Cancel</button>
          <button class="btn btn-primary" data-action="portal-contact-sent">Send message</button>
        </div>
      `);
      break;
    case "portal-contact-sent":
      closeModal();
      showToast("Message sent — we'll reply within 1 working day");
      break;

    case "admin-login":
      state.adminLoggedIn = true;
      state.adminSection = "overview";
      go("admin");
      break;
    case "admin-logout":
      state.adminLoggedIn = false;
      go("home");
      break;
    case "admin-nav":
      state.adminSection = t.dataset.sec;
      render();
      break;
    case "admin-export":
      downloadTextFile("northbridge_summary_export.txt",
        "NORTHBRIDGE INSURANCE — DEMO EXPORT\n\nCustomers: "+CUSTOMERS.length+"\nQuotes: "+QUOTES_LOG.length+"\nPolicies: "+POLICIES.length+"\nPayments: "+PAYMENTS.length+"\nClaims: "+CLAIMS.length+"\n\n(This is placeholder demo content.)");
      showToast("Export downloaded");
      break;
  }
});

document.addEventListener("input", function(e){
  const el = e.target;
  if(el.dataset && el.dataset.field){
    state.formData[el.dataset.field] = el.value;
  }
  if(el.dataset && el.dataset.action === "admin-search"){
    filterTable(el.dataset.target);
  }
});
document.addEventListener("change", function(e){
  const el = e.target;
  if(el.dataset && el.dataset.field){
    state.formData[el.dataset.field] = el.value;
    if(["yearsAtAddress","employment"].includes(el.dataset.field)){
      render();
    }
  }
});

/* ------------------------------ Init -------------------------------------------- */
render();
</script>
